<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Pay Clone - Mobile Payment App</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Mobile Header -->
        <header class="mobile-header" id="mobileHeader">
            <div class="header-content">
                <div class="header-left">
                    <button class="header-btn menu-btn" id="menuBtn">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
                <div class="header-center">
                    <h1 class="app-title">Google Pay</h1>
                </div>
                <div class="header-right">
                    <button class="header-btn notification-btn" id="notificationBtn">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge" id="notificationBadge">0</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-content" id="mainContent">
            <!-- Home Screen -->
            <div class="screen" id="homeScreen" data-screen="home">
                <div class="home-container">
                    <!-- User Card -->
                    <div class="user-card">
                        <div class="user-info">
                            <img src="https://via.placeholder.com/50" alt="User Avatar" class="user-avatar">
                            <div class="user-details">
                                <p class="greeting" id="userGreeting">Hello,</p>
                                <h2 class="user-name" id="userName">Guest User</h2>
                            </div>
                        </div>
                        <button class="profile-btn" onclick="goToScreen('profile')">
                            <i class="fas fa-user-circle"></i>
                        </button>
                    </div>

                    <!-- Balance Card -->
                    <div class="balance-card">
                        <div class="balance-header">
                            <h3>Account Balance</h3>
                            <button class="toggle-balance" id="toggleBalance">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <h1 class="balance-amount" id="balanceAmount">₹0.00</h1>
                        <p class="balance-subtitle">Available in your account</p>
                    </div>

                    <!-- Quick Actions -->
                    <div class="quick-actions">
                        <button class="action-btn" onclick="goToScreen('transfer')">
                            <div class="action-icon send-icon">
                                <i class="fas fa-paper-plane"></i>
                            </div>
                            <span>Send</span>
                        </button>
                        <button class="action-btn" onclick="goToScreen('request-money')">
                            <div class="action-icon request-icon">
                                <i class="fas fa-hand-holding-usd"></i>
                            </div>
                            <span>Request</span>
                        </button>
                        <button class="action-btn" onclick="goToScreen('qr')">
                            <div class="action-icon qr-icon">
                                <i class="fas fa-qrcode"></i>
                            </div>
                            <span>QR Code</span>
                        </button>
                        <button class="action-btn" onclick="goToScreen('payment')">
                            <div class="action-icon pay-icon">
                                <i class="fas fa-credit-card"></i>
                            </div>
                            <span>Pay</span>
                        </button>
                    </div>

                    <!-- Financial Services Grid -->
                    <div class="services-section">
                        <h3>Financial Services</h3>
                        <div class="services-grid">
                            <button class="service-btn" onclick="goToScreen('investments')" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                                <i class="fas fa-chart-line"></i>
                                <span>Invest</span>
                            </button>
                            <button class="service-btn" onclick="goToScreen('insurance')" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                                <i class="fas fa-shield-alt"></i>
                                <span>Insurance</span>
                            </button>
                            <button class="service-btn" onclick="goToScreen('lending')" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                                <i class="fas fa-credit-card"></i>
                                <span>Loans</span>
                            </button>
                            <button class="service-btn" onclick="goToScreen('analytics')" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
                                <i class="fas fa-chart-pie"></i>
                                <span>Insights</span>
                            </button>
                            <button class="service-btn" onclick="goToScreen('crypto-wallet')" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">
                                <i class="fas fa-coins"></i>
                                <span>Crypto</span>
                            </button>
                            <button class="service-btn" onclick="goToScreen('savings')" style="background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);">
                                <i class="fas fa-piggy-bank"></i>
                                <span>Savings</span>
                            </button>
                            <button class="service-btn" onclick="goToScreen('subscriptions')" style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);">
                                <i class="fas fa-sync"></i>
                                <span>Subscriptions</span>
                            </button>
                            <button class="service-btn" onclick="goToScreen('budget')" style="background: linear-gradient(135deg, #ff9a56 0%, #ff6a88 100%);">
                                <i class="fas fa-chart-bar"></i>
                                <span>Budget</span>
                            </button>
                            <button class="service-btn" onclick="goToScreen('referral')" style="background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);">
                                <i class="fas fa-share-nodes"></i>
                                <span>Referral</span>
                            </button>
                            <button class="service-btn" onclick="goToScreen('loyalty-dashboard')" style="background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);">
                                <i class="fas fa-star"></i>
                                <span>Loyalty</span>
                            </button>
                        </div>
                    </div>

                    <!-- Recent Transactions -->
                    <div class="transactions-section">
                        <div class="section-header">
                            <h3>Recent Activity</h3>
                            <a href="#" onclick="goToScreen('history'); return false;" class="see-all-link">See all</a>
                        </div>
                        <div class="transactions-list" id="recentTransactions">
                            <!-- Populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Other screens will be loaded here dynamically -->
            <div id="screenContent"></div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav" id="bottomNav">
            <button class="nav-btn active" onclick="goToScreen('home')" data-screen="home">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </button>
            <button class="nav-btn" onclick="goToScreen('payment')" data-screen="payment">
                <i class="fas fa-mobile-alt"></i>
                <span>Pay</span>
            </button>
            <button class="nav-btn" onclick="goToScreen('history')" data-screen="history">
                <i class="fas fa-history"></i>
                <span>Activity</span>
            </button>
            <button class="nav-btn" onclick="goToScreen('profile')" data-screen="profile">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </button>
        </nav>
    </div>

    <!-- Modals -->
    <div class="modal" id="menuModal">
        <div class="modal-overlay" onclick="closeMenu()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Menu</h2>
                <button class="close-btn" onclick="closeMenu()">×</button>
            </div>
            <div class="modal-body">
                <ul class="menu-list">
                    <li><a href="#" onclick="goToScreen('profile'); closeMenu(); return false;">Profile</a></li>
                    <li><a href="#" onclick="goToScreen('bank-accounts'); closeMenu(); return false;">Bank Accounts</a></li>
                    <li><a href="#" onclick="goToScreen('security'); closeMenu(); return false;">Security</a></li>
                    <li><a href="#" onclick="goToScreen('notifications'); closeMenu(); return false;">Notifications</a></li>
                    <li><a href="#" onclick="goToScreen('settings'); closeMenu(); return false;">Settings</a></li>
                    <li><a href="#" onclick="logout(); return false;">Logout</a></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
